[package]
name = "cashonn"
version = "1.13.0"
description = "Cashonn - Personal Finance Software"
authors = ["Navaneeth Narayanan"]
edition = "2021"

[lib]
name = "cashonn_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
# this feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Ship smaller binaries. Without this, cargo defaults to no LTO, 16 codegen units and
# retained symbols, which is a large slice of the ~14MB release library.
# `lto = "thin"` rather than `true` (fat): most of the size win at a fraction of the
# link time, which matters because both the desktop and the Android APK are built often.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
